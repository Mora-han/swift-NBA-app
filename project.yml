name: NBA

options:
  bundleIdPrefix: com.littlecodesauce
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"

settings:
  base:
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # 本地开发用 ad-hoc 签名（模拟器 / 本机 macOS 直接可跑）；上架时在 Xcode 里选择团队即可
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  NBAKit:
    path: Packages/NBAKit

targets:
  NBA:
    type: application
    platform: iOS            # 通过下方 SDKROOT/SUPPORTED_PLATFORMS 做成 iOS + iPadOS + macOS 单一多平台 target
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: AppIcon.icon
      # 启动图 storyboard 只给 iOS 编：macOS 不认 UIKit storyboard，
      # 单一多平台 target 下无法用 source 级过滤，改用下方按 SDK 的条件构建设置排除
      - path: Resources/LaunchScreen.storyboard
    dependencies:
      - package: NBAKit
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: NBA
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.sports
        ITSAppUsesNonExemptEncryption: false
        # iOS 系统启动图（原生机制，非自建遮罩）：用 launch storyboard 才能自适应屏幕。
        # UILaunchScreen 的 UIImageName 只能按图片自然尺寸居中，做不到随屏缩放，故不用。
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 队徽/球员图部分为 http:// 明文地址
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.littlecodesauce.nba
        PRODUCT_NAME: NBA
        SDKROOT: auto
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # macOS 侧不编启动图（ibtool 拒绝 iOS storyboard）；iOS 侧照常编进 Resources
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=macosx*]": "LaunchScreen.storyboard"
    scheme:
      run:
        config: Debug
      profile:
        config: Release
      analyze:
        config: Debug
      archive:
        config: Release
